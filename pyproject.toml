[project]
name = "goalbench"
version = "0.2.1"
description = "Reproducible benchmark of choice-style classifiers (Laya, Strands Decider) for customer-goal classification in Brazilian Portuguese, with an embedding shortlist and a calibrated combination."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Fulvio Jorge da Silva" }]
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
]

[project.urls]
Repository = "https://github.com/fuljorge/goal-classification-bench"

[project.scripts]
goalbench = "goalbench.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goalbench"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["servers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Slide text: long literal lines and the typographic minus sign are intentional.
"posts/*.py" = ["E501", "RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
